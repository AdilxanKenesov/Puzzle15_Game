name: Release

# v1.0.0 kabi tag push qilinganda imzolangan AAB va APK yig'iladi, GitHub Release'ga qo'shiladi,
# PLAY_SERVICE_ACCOUNT_JSON berilgan bo'lsa AAB Play internal track'ga yuklanadi.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PUZZLE15_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/puzzle15-upload.jks"
          echo "PUZZLE15_KEYSTORE_PATH=$RUNNER_TEMP/puzzle15-upload.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed AAB and APK
        env:
          PUZZLE15_KEYSTORE_PASSWORD: ${{ secrets.PUZZLE15_KEYSTORE_PASSWORD }}
          PUZZLE15_KEY_ALIAS: ${{ secrets.PUZZLE15_KEY_ALIAS }}
          PUZZLE15_KEY_PASSWORD: ${{ secrets.PUZZLE15_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          name="Puzzle15-${GITHUB_REF_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$name.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/$name-mapping.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: puzzle15-release
          path: dist/

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload to Google Play (internal track)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uz.visionsystemscorp.puzzle15game
          releaseFiles: dist/*.aab
          mappingFile: dist/Puzzle15-${{ github.ref_name }}-mapping.txt
          track: internal
          status: completed

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/puzzle15-upload.jks"
